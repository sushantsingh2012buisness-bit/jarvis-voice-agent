<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060b10"><title>Orb</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script><script defer src="/voice.js"></script></head>
<body><header><div class="header-right"><span id="connection">CONNECTING</span><button id="settings" aria-label="Open voice settings" title="Voice settings">⚙</button></div></header>
<main><section class="voice-stage" aria-label="Jarvis voice core"><button id="core-button" aria-label="Start talking to Jarvis"><canvas id="core" aria-hidden="true"></canvas><span class="center-point" aria-hidden="true"></span></button><div class="voice-state"><span id="state-light"></span><span id="state-label" role="status" aria-live="polite">INITIALIZING</span></div><p id="instruction">CLICK TO SPEAK</p><button id="stop" type="button" aria-label="Stop voice session">■ STOP</button><div class="sr-only" aria-live="polite"><p id="user-line"></p><p id="jarvis-line"></p></div></section></main>
<footer><span id="brain-status">CHECKING BRAIN</span><span id="voice-status">FISH AUDIO</span></footer>
<dialog id="settings-dialog"><div class="dialog-top"><h2>VOICE CONFIGURATION</h2><button id="close-settings" aria-label="Close settings">×</button></div><label for="brain">BRAIN</label><select id="brain"><option value="codex">Codex � signed-in ChatGPT</option></select><p id="brain-detail"></p><label for="voice-input">INPUT</label><select id="voice-input"><option value="browser">Browser speech recognition</option><option value="fish">Fish Audio transcription</option></select><p id="input-detail"></p><div class="setting-row"><div><strong>VOICE OUTPUT</strong><span>Fish Audio · s2.1-pro-free</span></div><input id="speak-replies" type="checkbox" checked aria-label="Speak replies with Fish Audio"></div><button id="test-voice" class="test-voice">TEST VOICE</button><p class="privacy-note">Microphone activates on click. Actions use available Codex tools and permissions. Fish credentials stay on the server.</p></dialog><div id="toast" role="status" aria-live="polite"></div><dialog id="approval-dialog"><h2>CODEX REQUEST</h2><div id="approval-content"></div><button id="allow-once" class="test-voice">ALLOW ONCE</button><button id="deny-once" class="test-voice">DENY</button><button id="submit-answer" class="test-voice" hidden>ANSWER</button><button id="answer-mic" class="test-voice">ANSWER BY VOICE</button></dialog></body></html>
